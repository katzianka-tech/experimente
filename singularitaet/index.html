<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Singularität</title>
<style>
/* Layout: one full-bleed canvas, a quiet start prompt and a quiet end card. Deliberately single dark theme (cinema). */
:root{
  --void:#030308;
  --ink:#e9e6f5;
  --dim:#8d88a6;
  --spark:#b9a8ff;
  --font-ui:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
canvas:active{cursor:grabbing}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(9vh + env(safe-area-inset-bottom,0px));font-family:var(--font-ui);text-align:center;pointer-events:none}
.overlay button{pointer-events:auto}
#start{cursor:pointer;background:none;border:0;color:var(--dim);font:500 12px/1.4 var(--font-ui);
  letter-spacing:.32em;text-transform:uppercase;padding:14px 18px;animation:breathe 2.4s ease-in-out infinite}
#start:focus-visible,#again:focus-visible{outline:1px solid var(--spark);outline-offset:4px}
.hint{color:var(--dim);font-size:11px;letter-spacing:.12em;opacity:.7}
@keyframes breathe{50%{opacity:.35}}
#end{opacity:0;transition:opacity 1.2s ease}
#end.on{opacity:1}
#stats{font-size:11px;letter-spacing:.14em;color:var(--dim);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;
  font-variant-numeric:tabular-nums;text-transform:uppercase}
#stats b{color:var(--ink);font-weight:600}
#again{background:none;border:1px solid #ffffff22;color:var(--ink);font:500 11px/1 var(--font-ui);letter-spacing:.28em;
  text-transform:uppercase;padding:12px 18px;border-radius:999px;cursor:pointer}
#again:hover{border-color:var(--spark)}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;font:13px/1.6 var(--font-ui);color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){#start{animation:none}}
</style>
</head>
<body>

<canvas id="c" aria-label="Echtzeit-Animation"></canvas>
<div class="overlay" id="intro">
  <button id="start" type="button">Tippen zum Starten</button>
  <div class="hint">Bild mit dem Finger ziehen, quetschen, dehnen</div>
  <div class="hint">mit Ton · 10 Sekunden · intensive Licht- und Bewegungseffekte</div>
</div>
<div class="overlay" id="end" hidden>
  <div id="stats"></div>
  <button id="again" type="button">Nochmal</button>
</div>
<div id="err" hidden></div>

<script>
(()=>{
const DUR=10;
const MOBILE=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&innerWidth<1100);
const cv=document.getElementById('c');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,powerPreference:'high-performance'});
const errBox=document.getElementById('err');
if(!gl){errBox.hidden=false;errBox.textContent='Dieser Browser kann kein WebGL. Bitte mit einem aktuellen Chrome, Safari oder Firefox öffnen.';return;}

/* ---------- Text texture (drawn at runtime: R = sharp glyphs, G = glow) ---------- */
const WORD='SINGULARITÄT';
const tc=document.createElement('canvas');tc.width=2048;tc.height=512;
(function drawText(){
  const tx=tc.getContext('2d');
  const fam='"Helvetica Neue",Arial,system-ui,sans-serif',track=.18;
  let size=300;
  const setF=ctx=>{ctx.font=`200 ${size}px ${fam}`;ctx.textAlign='center';ctx.textBaseline='middle';};
  setF(tx);
  const measure=()=>{let w=0;for(const ch of WORD)w+=tx.measureText(ch).width+size*track;return w-size*track;};
  while(measure()>1840&&size>40){size-=6;setF(tx);}
  const total=measure();
  const paint=(ctx,blur,color)=>{setF(ctx);ctx.filter=blur?`blur(${blur}px)`:'none';ctx.fillStyle=color;let x=1024-total/2;
    for(const ch of WORD){const w=ctx.measureText(ch).width;ctx.fillText(ch,x+w/2,262);x+=w+size*track;}ctx.filter='none';};
  const a=document.createElement('canvas');a.width=2048;a.height=512;paint(a.getContext('2d'),0,'#f00');
  const b=document.createElement('canvas');b.width=2048;b.height=512;const bc=b.getContext('2d');paint(bc,28,'#0f0');paint(bc,10,'#0f0');
  const c3=document.createElement('canvas');c3.width=2048;c3.height=512;const k3=c3.getContext('2d');
  k3.font=`200 300px ${fam}`;k3.textAlign='center';k3.textBaseline='middle';k3.fillStyle='#00f';
  {const w=['I','C','H'].map(ch=>k3.measureText(ch).width),gap=300*.22,tot=w.reduce((x,y)=>x+y)+gap*2;let x=1024-tot/2;
   ['I','C','H'].forEach((ch,i)=>{k3.fillText(ch,x+w[i]/2,262);x+=w[i]+gap;});}
  tx.fillStyle='#000';tx.fillRect(0,0,2048,512);
  tx.globalCompositeOperation='lighter';tx.drawImage(a,0,0);tx.drawImage(b,0,0);tx.drawImage(c3,0,0);tx.globalCompositeOperation='source-over';
})();

/* ---------- Shaders ---------- */
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS_SCENE=`
precision highp float;
uniform vec2 uRes;uniform float uT;uniform sampler2D uTex;
uniform vec3 uRo,uFwd,uLp;
uniform float uRoll,uFoc,uLight,uH,uTw,uM,uOut,uFlash,uTxt,uWave,uCore,uTextW,uX,uKal,uIch,uIchG,uIchD;
#define MAXS ${MOBILE?72:100}
#define REFL ${MOBILE?28:44}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
vec3 pal(float t){return .5+.5*cos(6.2831*(vec3(.95,1.,1.05)*t+vec3(.0,.33,.67)));}

/* an endless Menger sponge carved out of solid space. The flight axis x=y=0 is a corridor at every scale,
   so the camera can travel through it forever. The space twists around that axis. */
float lev;
float map(vec3 p){
  float a=p.z*uTw+uT*.12+uX*.9*sin(p.z*.6+uT*1.3);float c=cos(a),s=sin(a);p.xy=mat2(c,-s,s,c)*p.xy;
  float rr=length(p.xy);p.xy*=1.+uX*.22*sin(rr*2.5-uT*2.2+p.z*.8);
  float h=uH+.1*uX*sin(uT*2.1+p.z*.7);
  float d=-1e5,sc=1.;lev=0.;
  for(int i=0;i<4;i++){
    vec3 q=mod(p*sc,2.)-1.;
    sc*=3.;
    vec3 r=abs(1.-3.*abs(q));
    float cc=(min(max(r.x,r.y),min(max(r.y,r.z),max(r.z,r.x)))-h)/sc;
    if(cc>d){d=cc;lev=float(i);}
  }
  if(uM>0.)d+=uM*.022*sin(p.x*5.+uT*2.)*sin(p.y*5.+uT*1.7)*sin(p.z*4.-uT*2.6);
  return d;
}
vec3 nrm(vec3 p,float e){vec2 k=vec2(1,-1);
  return normalize(k.xyy*map(p+k.xyy*e)+k.yyx*map(p+k.yyx*e)+k.yxy*map(p+k.yxy*e)+k.xxx*map(p+k.xxx*e));}

vec3 env(vec3 rd){
  float a=atan(rd.x,rd.y),y=rd.z;
  vec3 c=vec3(.004,.004,.012);
  c+=vec3(.25,.18,.6)*pow(max(0.,sin(y*14.+uT*.6)*.5+.5),40.)*.35;
  float band=exp(-abs(rd.y-.15*sin(rd.x*4.+uT*.3))*7.);
  c+=mix(vec3(.15,.05,.4),vec3(.0,.35,.5),.5+.5*sin(a*3.+uT*.4))*band*.55;
  c+=step(.9975,hash3(floor(rd*180.)))*.9;
  return c;
}
vec3 shade(vec3 p,vec3 n,vec3 rd,float lv){
  vec3 L=uLp-p;float ld=length(L);L/=ld;
  float att=uLight/(1.+ld*ld*.55);
  vec3 irid=pal(lv*.23+p.z*.04+uT*(.05+.22*uX)+.55);
  vec3 base=mix(vec3(.035,.03,.05),irid*irid,.45);
  float dif=max(dot(n,L),0.);
  float spe=pow(max(dot(reflect(rd,n),L),0.),36.);
  float fr=pow(1.-max(dot(n,-rd),0.),4.);
  vec3 c=base*(dif*att*vec3(1.,.93,.86)+.015)+spe*att*.7*mix(vec3(1.),irid,.5);
  c+=irid*fr*att*.35;
  return c;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

void main(){
  vec2 fc=gl_FragCoord.xy;
  vec2 uv0=(fc-.5*uRes)/uRes.y;
  float rl=length(uv0);
  float cr=cos(uRoll),sr=sin(uRoll);vec2 uv=mat2(cr,-sr,sr,cr)*uv0;
  if(uKal>0.){float ka=atan(uv.y,uv.x),kr=length(uv),seg=6.2831853/6.;ka=abs(mod(ka,seg)-seg*.5);
    uv=mix(uv,kr*vec2(cos(ka),sin(ka)),uKal);}
  float wave=uWave>0.?exp(-pow((rl-uWave)*9.,2.))*.06*(1.-smoothstep(0.,1.6,uWave)):0.;
  uv*=1.-wave/max(rl,.001);
  vec3 ww=uFwd,uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+uFoc*ww);
  vec3 ro=uRo;
  vec3 col=vec3(0.);

  if(uOut<.5){
    float t=.02,glow=0.,st=0.;bool hit=false;
    for(int i=0;i<MAXS;i++){
      float d=map(ro+rd*t);
      glow+=exp(-d*30.);
      if(d<.0005*t+.0002){hit=true;st=float(i);break;}
      t+=d*mix(.7,.5,uX);st=float(i);
      if(t>18.)break;
    }
    vec3 fogc=vec3(.02,.018,.06)*uLight;
    if(hit){
      vec3 p=ro+rd*t;float lv=lev;
      vec3 n=nrm(p,.0006*t+.0002);
      float ao=1.-st/float(MAXS);ao*=ao;
      vec3 c=shade(p,n,rd,lv)*ao;
      if(uM>0.001){
        // liquid walls: they mirror the corridors around you
        vec3 rr=reflect(rd,n);float s=.01;bool h2=false;
        for(int i=0;i<REFL;i++){float d=map(p+n*.003+rr*s);if(d<.001*s+.0003){h2=true;break;}s+=d*.8;if(s>8.)break;}
        vec3 rc=fogc;
        if(h2){vec3 q=p+rr*s;vec3 n2=nrm(q,.002);rc=shade(q,n2,rr,lev);rc=mix(rc,fogc,1.-exp(-(t+s)*.2));}
        float fr=pow(1.-max(dot(n,-rd),0.),3.);
        vec3 liquid=rc*(.45+.55*fr)+pal(fr*1.3+p.z*.05+uT*.15)*fr*.35*uLight*.4;
        liquid+=pow(max(dot(rr,normalize(uLp-p)),0.),90.)*uLight*1.5;
        c=mix(c,liquid,uM);
      }
      col=mix(c,fogc,1.-exp(-t*.2));
    }else col=fogc;
    col+=vec3(.5,.42,1.)*glow*.0025*uLight;
  }else{
    col=env(rd);
  }

  // the singularity: the light you fly toward, always straight ahead
  col+=vec3(.85,.8,1.)*uCore*(.0022/(dot(uv0,uv0)+.00035)+.05*exp(-rl*5.));

  if(uIch>0.){
    vec2 q=uv0/(vec2(1.25,.3125)*(1.+uIchG))+.5;
    float ca=.002+uIchG*.012;
    vec3 tx=vec3(texture2D(uTex,q+vec2(ca,0.)).b,texture2D(uTex,q).b,texture2D(uTex,q-vec2(ca,0.)).b);
    float inside=step(0.,q.x)*step(q.x,1.)*step(0.,q.y)*step(q.y,1.);
    float keep=step(uIchD,hash(floor(fc/3.)));
    col+=tx*inside*keep*uIch*1.3;
  }
  if(uWave>0.){
    float fade=1.-smoothstep(.2,1.8,uWave);
    col+=vec3(.6,.55,1.)*exp(-pow((rl-uWave)*22.,2.))*fade*1.1;
    col+=vec3(1.,.6,.9)*exp(-pow((rl-uWave*.82)*30.,2.))*fade*.5;
  }

  if(uTxt>0.){
    vec2 q=uv0/vec2(uTextW,uTextW*.25)+.5;
    float k=clamp(uTxt,0.,1.);
    float rad=k*k*1.35;
    float e=1.-smoothstep(rad,rad-.35,rl);e*=e;
    vec2 cell=floor(fc/2.);
    vec2 jitter=(vec2(hash(cell),hash(cell+7.3))-.5)*e*.5;
    vec2 tq=q+jitter-uv0*e*.8/vec2(uTextW,uTextW*.25);
    float ca=.003+e*.04;
    vec3 tex=vec3(texture2D(uTex,tq+vec2(ca,0.)).r,texture2D(uTex,tq).r,texture2D(uTex,tq-vec2(ca,0.)).r);
    float g=texture2D(uTex,q).g;
    float inside=step(0.,tq.x)*step(tq.x,1.)*step(0.,tq.y)*step(tq.y,1.);
    float sparkle=step(e*.9,hash(cell+floor(uT*30.)));
    col+=tex*inside*sparkle*1.6+tex*inside*exp(-pow((rl-rad)*9.,2.))*vec3(.9,.8,1.)*1.6;
    col+=vec3(.45,.35,1.)*g*.35*smoothstep(.3,1.,k);
  }

  col+=vec3(1.,.95,1.)*uFlash;
  col=aces(col*1.15);
  vec2 v=fc/uRes;col*=.35+.65*pow(16.*v.x*v.y*(1.-v.x)*(1.-v.y),.22);
  gl_FragColor=vec4(pow(col,vec3(.4545)),1.);
}`;
/* blends the new frame with the last one: camera-like motion blur and smoother edges */
const FS_ACC=`precision mediump float;uniform sampler2D uS,uH;uniform vec2 uRes;uniform float uK,uTr,uZ,uA,uHue;
vec3 hue(vec3 c,float a){mat3 toY=mat3(.299,.596,.211,.587,-.274,-.523,.114,-.322,.312);
  mat3 toR=mat3(1.,1.,1.,.956,-.272,-1.106,.621,-.647,1.703);vec3 y=toY*c;float cs=cos(a),sn=sin(a);
  y.yz=mat2(cs,sn,-sn,cs)*y.yz;return clamp(toR*y,0.,1.);}
void main(){vec2 uv=gl_FragCoord.xy/uRes;vec3 s=texture2D(uS,uv).rgb;
  vec2 asp=vec2(uRes.x/uRes.y,1.);vec2 d=(uv-.5)*asp;float c=cos(uA),sn=sin(uA);
  d=mat2(c,-sn,sn,c)*d*uZ;
  vec3 h=texture2D(uH,d/asp+.5).rgb;
  vec3 o=mix(s,texture2D(uH,uv).rgb,uK);
  vec3 hh=hue(h,uHue);float l=dot(hh,vec3(.299,.587,.114));hh=clamp(mix(vec3(l),hh,1.35)*(.92+.08*l),0.,1.);
  if(uTr>0.)o=max(o,hh*uTr);   // video feedback: every frame flows outward, turning and changing colour
  gl_FragColor=vec4(o,1.);}`;
/* elastic touch: each finger drags the picture around it like rubber */
const FS_OUT=`precision highp float;uniform sampler2D uH;uniform vec2 uRes;uniform float uT;uniform vec4 uB[4];uniform float uTe[4];
void main(){vec2 fc=gl_FragCoord.xy;
 vec2 asp=vec2(uRes.x/uRes.y,1.);vec2 p=(fc/uRes-.5)*asp;
 vec2 disp=vec2(0.);float str=0.;
 for(int i=0;i<4;i++){vec2 off=uB[i].zw;float L=length(off);
   if(L<1e-5)continue;
   vec2 c=uB[i].xy+off;float r=.2+.55*L;vec2 dd=p-c;
   float w=exp(-dot(dd,dd)/(r*r));disp+=off*w;str+=w*L;
   float te=uTe[i]*w;
   if(te>.002){vec2 dir=off/L,nr=vec2(-dir.y,dir.x);
     float band=floor(dot(p,nr)*38.);float rnd=fract(sin(band*91.7+floor(uT*24.))*4375.5)-.5;
     disp+=dir*rnd*te*.14;str+=te*.9;}}
 vec2 uv=(p-disp)/asp+.5;
 float ca=min(str,.6)*.025;
 vec3 c=vec3(texture2D(uH,uv+vec2(ca,0.)).r,texture2D(uH,uv).g,texture2D(uH,uv-vec2(ca,0.)).b);
 c*=1.+min(str,.6)*.35;
 float n=fract(sin(dot(vec3(fc,fract(uT)*97.),vec3(12.9898,78.233,37.719)))*43758.5453)-.5;
 gl_FragColor=vec4(c+n*.022*(.4+c),1.);}`;

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function program(fs,names){
  const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};names.forEach(n=>u[n]=gl.getUniformLocation(p,n));return {p,u};
}
const SCENE_U=['uRes','uT','uTex','uRo','uFwd','uLp','uRoll','uFoc','uLight','uH','uTw','uM','uOut','uFlash','uTxt','uWave','uCore','uTextW','uX','uKal','uIch','uIchG','uIchD'];
let S,ACC,OUT;
try{S=program(FS_SCENE,SCENE_U);ACC=program(FS_ACC,['uS','uH','uRes','uK','uTr','uZ','uA','uHue']);OUT=program(FS_OUT,['uH','uRes','uT','uB','uTe']);}
catch(e){errBox.hidden=false;errBox.textContent='Der Shader liess sich auf diesem Gerät nicht übersetzen.';console.error(e);return;}
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function texParams(){gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);}
gl.activeTexture(gl.TEXTURE0);
const textTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,textTex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tc);texParams();
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);

/* ---------- Render targets ---------- */
let W=2,H=2,targets=[],cur=0;
const blobs=[]; // one per finger: grab point g, offset o, velocity v
function makeTarget(w,h){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);texParams();
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);return {t,f};}
let scale=1;
const MAXSCALE=Math.min(window.devicePixelRatio||1,MOBILE?1.5:2);
function applySize(){
  const w=Math.max(2,Math.round(innerWidth*scale)),h=Math.max(2,Math.round(innerHeight*scale));
  if(w===W&&h===H&&targets.length)return;
  W=w;H=h;cv.width=w;cv.height=h;
  targets.forEach(x=>{gl.deleteTexture(x.t);gl.deleteFramebuffer(x.f);});
  targets=[makeTarget(w,h),makeTarget(w,h),makeTarget(w,h)]; // scene, history A, history B
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

/* ---------- Timeline: every phase overlaps the next one ---------- */
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const clamp01=x=>Math.min(1,Math.max(0,x));
/* speed along the corridor, and its integral = distance travelled */
function speed(t){return .22+1.15*ss(1.0,3.2,t)-.35*ss(4.9,6.2,t)+9*Math.pow(clamp01((t-6.7)/1.3),3);}
function travelled(t){const n=240,h=t/n;let s=speed(0)+speed(t);for(let i=1;i<n;i++)s+=speed(i*h)*(i%2?4:2);return s*h/3;}
function params(t){
  const P={};
  const z=-travelled(Math.min(t,7.98));
  const kick=t>5?Math.exp(-(t-5)*6)*Math.sin((t-5)*60)*.012:0;   // the impact shakes you
  P.uRo=[.025*Math.sin(t*.7)+kick,.02*Math.sin(t*.9+1),z];
  const yaw=.06*Math.sin(t*.45)*(1-ss(6.8,7.8,t)),pitch=.04*Math.sin(t*.6+2)*(1-ss(6.8,7.8,t));
  P.uFwd=[Math.sin(yaw),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)];
  P.uLp=[0,0,z-2.6];
  P.uRoll=.35*Math.sin(t*.33)+.5*ss(2,7.5,t);
  P.uFoc=1.45-.6*ss(6.9,7.95,t);                // the view widens as you are pulled in
  P.uLight=.03+1.4*ss(.4,2.9,t)-.35*ss(5.5,6.5,t)+2.6*Math.pow(ss(7.2,7.97,t),2);
  P.uH=1.32-.42*ss(1.5,5.2,t);                   // the corridors open up around you
  P.uTw=.03+.09*ss(2.,6.5,t);
  P.uM=ss(4.95,6.0,t);                           // walls turn liquid on the impact
  P.uOut=t>=7.98?1:0;                            // through the singularity, into open space
  P.uCore=1-.65*ss(.8,2.4,t)+5*Math.pow(ss(6.8,7.98,t),2)*(t<7.98?1:0)+(t>=7.98?1.2*(1-ss(8.2,9.8,t)*.85):0);

    // last resort only: one single step down if the device is far too slow
    if(!downgraded&&frames>40){slowStreak=dtAvg>40?slowStreak+1:0;
      if(slowStreak>20){downgraded=true;scale=Math.max(.25,scale*.75);applySize();}}
    const t=Math.max(0,clock());
    render(Math.min(t,DUR),frames===0?0:BLEND,Math.min(dt,50));
    frames++;pixels+=W*H;
    if(t>=DUR){mode='end';finish();}
  }else{
    outOnly(now/1000);   // the final picture stays, and you can still knead it
  }
  requestAnimationFrame(tick);
}
function start(){
  intro.hidden=true;endEl.hidden=true;endEl.classList.remove('on');
  frames=0;pixels=0;slowStreak=0;
  try{ ensureAudio(); t0=schedule(ac); useAudio=true; }
  catch(e){ useAudio=false; t0=performance.now()/1000; }
  mode='run';
}
function finish(){
  const kb=(new Blob([document.documentElement.outerHTML]).size/1024).toFixed(0);
  stats.innerHTML=`<span><b>${frames}</b> Bilder live berechnet</span><span><b>${(pixels/1e6).toFixed(0)}</b> Mio. Pixel</span><span><b>0</b> Videos · <b>0</b> Grafiken · <b>0</b> Audiodateien</span><span><b>${kb}</b> KB Code</span>`;
  endEl.hidden=false;requestAnimationFrame(()=>endEl.classList.add('on'));
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('again').addEventListener('click',start);
addEventListener('resize',()=>{if(mode==='idle')applySize();});

if(query.has('t')){ // frozen frame for previews; ?pull=x,y,dx,dy simulates a finger
  intro.hidden=true;scale=1;applySize();const ft=parseFloat(query.get('t'))||0;
  if(query.has('pull')){const [x,y,dx,dy]=query.get('pull').split(',').map(Number);blobs.push({gx:x,gy:y,ox:dx,oy:dy,vx:0,vy:0,active:true,tear:parseFloat(query.get('tear')||0)});}
  for(let i=14;i>=0;i--)render(Math.max(0,ft-i/30),i===14?0:BLEND,33.3);window.__rendered=true;
}else{benchmark();window.__scale=scale;lastNow=performance.now();requestAnimationFrame(tick);}
})();
</script>
